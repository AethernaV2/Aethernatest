    <!-- Estilos comunes + estilos propios de esta página + Tailwind compilado (ver LEEME.md) -->
    <link rel="stylesheet" href="styles.css?v=3">
    <style id="page-style">
        .reveal { opacity: 0; translate: 0 40px; transition: opacity .8s cubic-bezier(.16,1,.3,1), translate .8s cubic-bezier(.16,1,.3,1); }
        .reveal.active { opacity: 1; translate: 0 0; }
        @media (prefers-reduced-motion: reduce) { .reveal { opacity: 1 !important; translate: none !important; transition: none !important; } }

        /* colores de cada estilo */
        :root { --dz-t1: #1B1546; --dz-t2: #0C0926; --dz-line: rgba(217,180,106,.55); --dz-glow: 157,108,240; --dz-d20a: #2B1A5C; --dz-d20b: #0A0722; --dz-stroke: #C4A0FF; --dz-num: #FFF2CF; --dz-frame: rgba(14,11,38,.88); --dz-accent: #C4A0FF; }
        html[data-theme="grimorio"] { --dz-t1: #25160A; --dz-t2: #0E0804; --dz-line: rgba(201,150,70,.6); --dz-glow: 224,144,47; --dz-d20a: #24150A; --dz-d20b: #090503; --dz-stroke: #F0B35A; --dz-num: #FFE9B8; --dz-frame: rgba(18,11,6,.9); --dz-accent: #F0B35A; }

        .dz-layout[hidden] { display: none !important; }
        .dz-layout { display: grid; gap: 2rem; align-items: start; }
        @media (min-width: 1024px) { .dz-layout { grid-template-columns: minmax(0, 700px) minmax(0, 1fr); gap: 2.5rem; } .dz-panel { position: sticky; top: 7.5rem; } }

        /* ===== Mapa de combate: suelo de mazmorra con cuadrícula ===== */
        :root { --dz-stone1: #232044; --dz-stone2: #15122E; --dz-wall: #0B0922; --dz-grid: rgba(196,160,255,.16); --dz-torch: 157,108,240; }
        html[data-theme="grimorio"] { --dz-stone1: #3A2A19; --dz-stone2: #1E140A; --dz-wall: #0C0703; --dz-grid: rgba(240,179,90,.15); --dz-torch: 255,150,50; }

        .dz-board { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 0; aspect-ratio: 7 / 6; width: 100%; padding: 14px;
            background:
              repeating-linear-gradient(0deg, transparent 0 calc(100% / var(--rows, 6) - 1px), var(--dz-grid) calc(100% / var(--rows, 6) - 1px) calc(100% / var(--rows, 6))),
              repeating-linear-gradient(90deg, transparent 0 calc(100% / var(--cols, 7) - 1px), var(--dz-grid) calc(100% / var(--cols, 7) - 1px) calc(100% / var(--cols, 7))),
              radial-gradient(ellipse at 50% 50%, var(--dz-stone1), var(--dz-stone2) 80%);
            border: 10px solid var(--dz-wall); outline: 2px solid var(--dz-line); outline-offset: -3px; overflow: clip;
            box-shadow: inset 0 0 60px rgba(0,0,0,.75), 0 22px 50px rgba(0,0,0,.6); }
        /* antorchas en las esquinas */
        .dz-torch { position: absolute; width: 38%; height: 38%; pointer-events: none; z-index: 0; opacity: .85; animation: dz-flick 3.2s ease-in-out infinite alternate; }
        .dz-torch.a { left: -6%; top: -6%; background: radial-gradient(circle at 20% 20%, rgba(var(--dz-torch), .42), transparent 62%); }
        .dz-torch.b { right: -6%; top: -6%; background: radial-gradient(circle at 80% 20%, rgba(var(--dz-torch), .42), transparent 62%); animation-delay: -1.1s; }
        .dz-torch.c { left: -6%; bottom: -6%; background: radial-gradient(circle at 20% 80%, rgba(var(--dz-torch), .42), transparent 62%); animation-delay: -2s; }
        .dz-torch.d { right: -6%; bottom: -6%; background: radial-gradient(circle at 80% 80%, rgba(var(--dz-torch), .42), transparent 62%); animation-delay: -.5s; }
        @keyframes dz-flick { from { opacity: .55; } to { opacity: 1; } }
        @media (prefers-reduced-motion: reduce) { .dz-torch { animation: none; } }

        .dz-tile { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; text-align: center; padding: 4px; cursor: pointer; overflow: hidden; margin: 2px;
            font-family: 'Cinzel', serif; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: clamp(5.4px, 1.05vw, 9.6px); line-height: 1.15; color: #D9CDB4; letter-spacing: .04em;
            background: linear-gradient(145deg, rgba(255,255,255,.07), rgba(0,0,0,.18)), var(--dz-stone1);
            border: 1px solid rgba(0,0,0,.55); box-shadow: inset 1px 1px 0 rgba(255,255,255,.14), inset -2px -2px 5px rgba(0,0,0,.5), 0 2px 4px rgba(0,0,0,.4);
            text-shadow: 0 -1px 0 rgba(0,0,0,.7), 0 1px 0 rgba(255,255,255,.12); transition: transform .2s, box-shadow .25s, color .25s, background .25s; }
        .dz-tile .n { position: absolute; left: 4px; top: 3px; font: 700 .85em 'Cinzel', serif; color: var(--dz-accent); opacity: .65; letter-spacing: 0; }
        .dz-tile:hover:not(:disabled), .dz-tile:focus-visible { transform: translateY(-2px); color: #FFF2CF; box-shadow: inset 1px 1px 0 rgba(255,255,255,.2), inset -2px -2px 5px rgba(0,0,0,.4), 0 0 16px rgba(var(--dz-glow), .5); outline: none; }
        .dz-tile.pass { color: #FFF2CF; background: linear-gradient(145deg, rgba(var(--dz-glow), .35), rgba(0,0,0,.2)), var(--dz-stone1); box-shadow: inset 0 0 12px rgba(var(--dz-glow), .5), 0 0 14px rgba(var(--dz-glow), .6); }
        .dz-tile.on { color: #FFF2CF; background: linear-gradient(145deg, rgba(var(--dz-glow), .5), rgba(0,0,0,.2)), var(--dz-stone1);
            box-shadow: inset 0 0 0 2px #E8C77D, inset 0 0 20px rgba(var(--dz-glow), .6), 0 0 24px rgba(var(--dz-glow), .75); }
        .dz-tile:disabled { cursor: progress; }
        .dz-fill { cursor: pointer; flex-direction: column; gap: 2px; color: #8F8466; font-weight: 600; background: linear-gradient(145deg, rgba(255,255,255,.03), rgba(0,0,0,.2)), var(--dz-stone2); }
        .dz-fill:hover:not(:disabled) { color: #FFF2CF; }
        .dz-fill.on { color: #FFF2CF; background: linear-gradient(145deg, rgba(255,140,40,.5), rgba(0,0,0,.25)), var(--dz-stone2); box-shadow: inset 0 0 0 2px #FFB25A, 0 0 24px rgba(255,150,50,.7); }
        .dz-fill::after { content: "\25C6"; font-size: .9em; color: var(--dz-accent); opacity: .45; }
        .dz-wrap { position: relative; width: 100%; }
        .dz-topbar { display: flex; align-items: flex-end; justify-content: flex-end; margin-bottom: .6rem; }
        .dz-snd { padding: .45rem .8rem; font: 700 9.5px 'Cinzel', serif; letter-spacing: .2em; text-transform: uppercase; color: #CDBB98; background: var(--dz-frame); border: 1px solid var(--dz-line); cursor: pointer; transition: color .2s, box-shadow .2s; }
        .dz-snd:hover { color: #FFF2CF; box-shadow: 0 0 12px rgba(var(--dz-glow), .4); }
        .dz-snd[aria-pressed="false"] { opacity: .65; }
        .dz-start { cursor: default; flex-direction: column; gap: 4px; }
        .dz-start img { width: 46%; height: auto; opacity: .9; }
        .dz-start span.lb { font-size: .78em; letter-spacing: .2em; color: var(--dz-accent); }

        /* centro: círculo de invocación con el dado */
        .dz-center { grid-area: 2 / 2 / 4 / 4; position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .5rem; text-align: center; padding: 8px; margin: 2px; }
        .dz-center .dz-d20 { width: clamp(70px, 19vw, 130px); height: clamp(70px, 19vw, 130px); }
        .dz-center::before { display: none; content: ""; position: absolute; inset: 4%; border-radius: 50%; pointer-events: none;
            background: radial-gradient(circle, rgba(var(--dz-glow), .22), transparent 66%), radial-gradient(circle, transparent 69%, rgba(var(--dz-glow), .5) 69.5%, transparent 70.5%), radial-gradient(circle, transparent 61%, rgba(var(--dz-glow), .3) 61.5%, transparent 62.5%);
            box-shadow: 0 0 0 1px rgba(var(--dz-glow), .15) inset; }
        .dz-center::after { display: none; content: ""; position: absolute; inset: 4%; border-radius: 50%; border: 1px dashed rgba(var(--dz-glow), .35); pointer-events: none; }
        .dz-center .dz-ring { display: none; position: absolute; inset: 0; margin: auto; width: 100%; max-width: none; height: auto; opacity: .3; pointer-events: none; }
        .dz-center .dz-ring path[fill] { display: none; }
        .dz-center .dz-ring { display: block; width: auto; height: 90%; max-width: 90%; aspect-ratio: 1; opacity: .65; }
        .dz-center .dz-ring g { stroke: var(--dz-accent); }
        .dz-center .dz-ring circle[stroke-dasharray], .dz-center .dz-ring .gs-inner, .dz-center .dz-ring g > circle:last-child { display: none; }
        .dz-d20, .dz-say { position: relative; z-index: 1; }
        .dz-d20 { width: clamp(60px, 15vw, 112px); height: clamp(60px, 15vw, 112px); overflow: visible; filter: none; }
        .dz-d20 svg { width: 100%; height: 100%; overflow: visible; transform-style: preserve-3d; }
        .dz-num { font: 700 25px 'Cinzel', serif; fill: var(--dz-num); text-anchor: middle; }
        .dz-d20.crit svg polygon:first-child { stroke: #FFF2CF; }
        .dz-halo { position: absolute; inset: -22%; background: radial-gradient(circle, rgba(var(--dz-glow), .5), transparent 65%); opacity: 0; transition: opacity .3s; pointer-events: none; }
        .dz-d20.go .dz-halo { opacity: 1; }
        .dz-say { font-family: 'EB Garamond', serif; font-style: italic; color: #E9D8B4; font-size: clamp(10px, 2.4vw, 16px); line-height: 1.25; min-height: 2.5em; max-width: 78%; text-shadow: 0 1px 4px rgba(0,0,0,.8); }
        .dz-say b { font-style: normal; font-family: 'Cinzel', serif; color: var(--dz-accent); letter-spacing: .1em; }

        /* miniatura sobre peana redonda */
        .dz-token { position: absolute; left: 0; top: 0; z-index: 6; width: 21px; height: 28px; margin: -24px 0 0 -10.5px; pointer-events: none; }
        .dz-token .base { position: absolute; left: 0; right: 0; bottom: 0; height: 11px; border-radius: 50%; background: radial-gradient(ellipse at 50% 35%, #8A6A35, #2A1A0C 75%); box-shadow: 0 0 0 1px rgba(0,0,0,.7), 0 3px 4px rgba(0,0,0,.6), 0 0 12px rgba(var(--dz-glow), .7); }
        .dz-token .body { position: absolute; left: 6px; right: 6px; bottom: 6px; top: 6px; clip-path: polygon(50% 0, 100% 100%, 0 100%); background: linear-gradient(180deg, #FFF2CF, #D9B46A 55%, #7A5524); }
        .dz-token .head { position: absolute; left: 50%; top: 0; width: 11px; height: 11px; margin-left: -5.5px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFF2CF, #D9B46A 60%, #7A5524); }

        /* ficha del dios: bloque de estadísticas */
        .dz-panel { position: relative; min-height: 420px; padding: 2.2rem 1.8rem; background: linear-gradient(180deg, rgba(255,255,255,.03), transparent), var(--dz-frame); border: 1px solid var(--dz-line); text-align: left;
            box-shadow: 0 18px 44px rgba(0,0,0,.5); display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; gap: .55rem; }
        .dz-panel::before, .dz-panel::after { content: ""; position: absolute; left: -1px; right: -1px; height: 6px; background: linear-gradient(90deg, #4A1209, #A5311B 50%, #4A1209); border-block: 1px solid #E8C77D; }
        .dz-panel::before { top: -1px; } .dz-panel::after { bottom: -1px; }
        .dz-mono { position: relative; width: 84px; height: 84px; align-self: flex-start; display: flex; align-items: center; justify-content: center; margin-bottom: .2rem; }
        .dz-mono svg { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .75; }
        .dz-mono svg * { stroke: var(--dz-accent) !important; }
        .dz-mono svg path[fill] { display: none; }
        .dz-mono span { position: relative; font: 900 34px 'Cinzel Decorative', serif; background: linear-gradient(180deg, #FFF2CF, var(--dz-accent)); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
        .dz-name { font: 700 clamp(26px, 3.6vw, 36px)/1.05 'Cinzel', serif; letter-spacing: .06em; color: #F3D9A0; text-shadow: 0 0 20px rgba(var(--dz-glow), .35); }
        .dz-title { font: italic 400 1.1rem 'EB Garamond', serif; color: #CDBB98; }
        .dz-rule { height: 3px; margin: .35rem 0; background: linear-gradient(90deg, #A5311B, rgba(165,49,27,.1)); clip-path: polygon(0 50%, 100% 0, 100% 100%); }
        .dz-kv { font-family: 'EB Garamond', serif; font-size: 1.05rem; line-height: 1.5; color: #E3D2B0; }
        .dz-note { font: italic 400 .95rem 'EB Garamond', serif; color: #B9A67E; }
        .dz-kv b { color: #D9644B; font-weight: 700; margin-right: .35rem; }
        .dz-desc { font-family: 'EB Garamond', serif; font-size: 1.12rem; line-height: 1.7; color: #E3D2B0; }
        .dz-desc.empty { font-style: italic; opacity: .75; }
        .dz-count { font: 600 10px 'Cinzel', serif; letter-spacing: .3em; text-transform: uppercase; color: #9C8865; margin-top: auto; padding-top: .8rem; }
.dz-btns { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: .4rem; }
        .dz-btns .dz-btn { margin-top: 0; }
        .dz-btn.dz-ghost { background: transparent; border-color: var(--dz-line); color: #CDBB98; }
        .dz-btn.dz-ghost:hover:not(:disabled) { color: #FFF2CF; border-color: #E8C77D; }
        /* animación a pantalla completa de «Ver más» */
        .dz-pic { margin: -1.8rem -1.6rem 1.1rem; aspect-ratio: 3 / 2; overflow: hidden; border-bottom: 1px solid rgba(var(--dz-glow), .45); position: relative; }
        .dz-pic::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 55%, rgba(8,5,16,.85)); }
        .dz-pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .dz-hero { margin: 0 0 1.8rem; border: 1px solid rgba(var(--dz-glow), .4); padding: 5px; background: rgba(0,0,0,.25); }
        .dz-hero img { width: 100%; height: auto; display: block; max-height: 70vh; object-fit: cover; }
        .dz-dogma { font-family: 'Cinzel', serif; letter-spacing: .18em; text-transform: uppercase; font-size: .85rem; color: var(--dz-accent); margin: 1.8rem 0 .2rem; padding-top: 1.2rem; border-top: 1px solid rgba(var(--dz-glow), .3); }
        .dz-cine { position: fixed; inset: 0; z-index: 9000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .dz-cine .bg { position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, rgba(var(--dz-glow), .38), rgba(5,3,10,.97) 70%); opacity: 0; }
        .dz-cine .flash { position: absolute; inset: 0; background: radial-gradient(circle, rgba(var(--dz-glow), .9), transparent 60%); opacity: 0; }
        .dz-cine svg { position: absolute; width: min(135vmin, 1200px); height: auto; opacity: 0; }
        .dz-cine svg * { stroke: var(--dz-accent) !important; }
        .dz-cine svg path[fill] { fill: var(--dz-accent); }
        .dz-cine .nm { position: relative; font: 900 clamp(34px, 8vw, 112px)/1 'Cinzel Decorative', serif; text-transform: uppercase; text-align: center; padding: 0 1rem; opacity: 0;
            background: linear-gradient(180deg, #FFF2CF, var(--dz-accent)); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 24px rgba(var(--dz-glow), .8)); }
        .dz-cine.in .bg { animation: dz-c-bg .55s ease-out forwards; }
        .dz-cine.in svg { animation: dz-c-sig 1s cubic-bezier(.25,.1,.3,1) forwards; }
        .dz-cine.in .flash { animation: dz-c-flash 1s ease-in forwards; }
        .dz-cine.in .nm { animation: dz-c-nm .8s cubic-bezier(.2,.8,.2,1) .35s forwards; }
        .dz-cine.out .bg { opacity: 1; animation: dz-c-bgout .8s ease-in forwards; }
        .dz-cine.out svg { opacity: .9; animation: dz-c-sigout .8s ease-in forwards; }
        .dz-cine.out .nm { opacity: 1; animation: dz-c-nmout .6s ease-in forwards; }
        .dz-cine.out .flash { opacity: .9; animation: dz-c-bgout .7s ease-out forwards; }
        @keyframes dz-c-bg { to { opacity: 1; } }
        @keyframes dz-c-sig { from { opacity: 0; transform: scale(.2) rotate(-150deg); } to { opacity: .9; transform: scale(1) rotate(40deg); } }
        @keyframes dz-c-flash { 0% { opacity: 0; } 70% { opacity: .5; } 100% { opacity: .9; } }
        @keyframes dz-c-nm { from { opacity: 0; letter-spacing: .6em; transform: scale(.9); } to { opacity: 1; letter-spacing: .1em; transform: scale(1); } }
        @keyframes dz-c-bgout { to { opacity: 0; } }
        @keyframes dz-c-sigout { to { opacity: 0; transform: scale(2.8) rotate(120deg); } }
        @keyframes dz-c-nmout { to { opacity: 0; transform: scale(1.12); } }

        /* ficha a página completa (como Razas y Clases) */
        .dz-detail[hidden] { display: none; }
        .dz-detail.show { animation: dz-in .7s cubic-bezier(.16,1,.3,1) both; }
        .dz-reading .dz-sub { display: none; }
        .dz-back { display: inline-block; margin-bottom: 1.4rem; cursor: pointer; }
        .dz-detail .dz-title { font-size: 1.15rem; margin-top: .25rem; }
        .dz-detail .dz-kv { margin-top: 1.2rem; }

        @media (prefers-reduced-motion: reduce) { .dz-detail.show { animation: none; } }
        .dz-btn { align-self: flex-start; margin-top: .4rem; padding: .7rem 1.4rem; font: 700 11px 'Cinzel', serif; letter-spacing: .22em; text-transform: uppercase; color: #FFF2CF; cursor: pointer;
            background: linear-gradient(135deg, rgba(165,49,27,.75), rgba(90,24,12,.6)); border: 1px solid #E8C77D; transition: box-shadow .2s, transform .2s; }
        .dz-btn:hover:not(:disabled) { box-shadow: 0 0 18px rgba(var(--dz-glow), .55); transform: translateY(-1px); }
        .dz-btn:disabled { opacity: .5; cursor: progress; }
        .dz-panel.swap > * { animation: dz-in .55s cubic-bezier(.16,1,.3,1) both; }
        .dz-panel.swap > *:nth-child(2) { animation-delay: .05s; } .dz-panel.swap > *:nth-child(3) { animation-delay: .1s; } .dz-panel.swap > *:nth-child(4) { animation-delay: .15s; } .dz-panel.swap > *:nth-child(5) { animation-delay: .2s; } .dz-panel.swap > *:nth-child(6) { animation-delay: .25s; }
        @keyframes dz-in { from { opacity: 0; translate: 0 14px; } to { opacity: 1; translate: 0 0; } }
        @media (prefers-reduced-motion: reduce) { .dz-panel.swap > * { animation: none; } }
        @media (max-width: 1023px) { .dz-tile { padding: 2px; letter-spacing: 0; font-size: 5.2px; } .dz-tile .n { font-size: 6px; left: 2px; top: 1px; } .dz-center::after { display: none; } .dz-panel { min-height: 0; padding: 1.8rem 1.1rem 1.4rem; } .dz-board { padding: 8px; border-width: 6px; } .dz-token { transform-origin: 50% 100%; } }

<body class="relative selection:bg-aetherna-goldMain selection:text-aetherna-bgMain">
    <!-- Fondo cósmico + brasas (los anima site.js) -->
    <canvas id="cosmos-bg" width="128" height="72" aria-hidden="true"></canvas>
    <canvas id="cosmos-stars" aria-hidden="true"></canvas>
    <canvas id="ember-canvas" aria-hidden="true"></canvas>

    <div id="page-root">
    <main class="pt-32 pb-24 px-4 max-w-6xl mx-auto relative z-10">

        <div class="text-center mb-12 reveal">
            <span class="font-cinzel text-aetherna-goldMain text-[10px] tracking-[0.35em] uppercase block mb-2">PANTEÓN DE AETHERNA</span>
            <h1 class="font-title-deco text-4xl sm:text-6xl text-aetherna-goldLight tracking-wider mb-4">LOS DIOSES</h1>
            <div class="w-24 h-[1px] bg-aetherna-goldMain mx-auto mb-6"></div>
            <p class="dz-sub font-garamond italic text-aetherna-parchment text-base sm:text-lg max-w-2xl mx-auto leading-relaxed">
                Elige una casilla y deja que los dados te lleven hasta el dios que quieres conocer.
            </p>
        </div>

        <div class="dz-layout reveal">
            <div class="dz-wrap" id="dz-wrap">
            <div class="dz-topbar">
                <button type="button" class="dz-snd" id="dz-snd" aria-pressed="true" title="Activar o quitar el sonido del dado"></button>

    <script src="site.js?v=3"></script>
    <script data-page>
        (function () {
            /* ============================================================
               DIOSES: edita aquí los textos. Para cada dios:
                 n = nombre · t = título (ej. "Diosa de la luz")
                 r = resumen corto (1-2 frases, es lo que se ve al llegar a la casilla)
                 d = historia completa (se ve al pulsar «Ver más»; separa párrafos con \n\n)
                 a = alineamiento (opcional) · s = símbolo sagrado (opcional)
               Si dejas t, r o d vacíos, la ficha muestra un aviso en su lugar.
               El orden de esta lista es el orden de las casillas (en el sentido del reloj).
               ============================================================ */
            const GODS = [
                { n: "Chassaria", t: "Deidad mayor", r: "Conocida como la maldita, nacida de las cenizas de todos los mundos, nacida del odio de Yog, la ansia de conocimiento de Set, Chassaria es una diosa calculadora, cínica, disfruta entrometiéndose en asuntos de los mortales, atrayendo a…",
                  d: "Conocida como la maldita, nacida de las cenizas de todos los mundos, nacida del odio de Yog, la ansia de conocimiento de Set, Chassaria es una diosa calculadora, cínica, disfruta entrometiéndose en asuntos de los mortales, atrayendo a estos a sus dominios para corromperlos, la belleza que posee esta es enfermiza, tanto Iasis como el dios de la luz Irión se ven afectados por su belleza cuando la observan, Chassaria posee el dominio de todos los pecados, utilizando estos para manipular a cientos, haciendo entrar aquellos a los que influye en una ira psicótica o una lujuria desenfrenada, así como cualquier otro pecado como la gula, su presencia es insostenible para cualquier mortal.",
                  a: "Legal Maligno", dom: "Lujuria, Ira, Gula, Envidia, Pereza, Avaricia, Soberbia", p: "Cenizas de la colisión", dg: "Disfruta de los placeres de la vida, sin importar que otros puedan verse afectados, arrodíllate ante la diosa pues esta los conoce bien, ella lo es todo, tus sueños y aspiraciones deben ser abandonados, pues esta sabrá proporcionarte lo que realmente anhelas, se libre bajo su manto de corrupción, deja que transforme tu cuerpo a su imagen y semejanza, ella es quien crea y destruye, ella es quien todo puede ver, nada se esconde frente sus tres ojos, peca libremente sin temor, se fiel a su mandato con tus acciones y obra siempre, por y para su infierno." },
                { n: "Iasis", t: "Deidad mayor", r: "Nacido junto a Chassaria ambos se crearon conjuntamente en el cosmos, pero Iasis se formo antes que la diosa maligna, tratando de destruirla antes de que su nacimiento se viese completado, en su intento de acabar con la mas pura maldad,…",
                  d: "Nacido junto a Chassaria ambos se crearon conjuntamente en el cosmos, pero Iasis se formo antes que la diosa maligna, tratando de destruirla antes de que su nacimiento se viese completado, en su intento de acabar con la mas pura maldad, Iasis sin quererlo termino mandando a Chassaria al Limbo, sembrando así la semilla del mal en el único plano donde la vida se expande, Iasis nació de la energía divina de Derketo y Jhebbal Sag, tomando así el control de la vida y la muerte, de la naturaleza en todos sus sentidos, sus esfuerzos son dedicados a mantener el ciclo de la vida activo, Iasis es quien mantiene el motor de la vida en un constante giro, acogiendo a las almas en el cosmos tras su muerte.",
                  a: "Neutral Autentico", dom: "Vida, muerte, naturaleza, caza", p: "La rueda del destino", dg: "La vida debe ser respetada pues es el principio de la existencia, la muerte es la ultima prueba de la vida, la cual debes aceptar como algo natural, cuida de la naturaleza, pues es esta la que nos proporciona alimento y prosperidad, caza por necesidad, y respeta a la presa como debe respetarse a un cazador, ayuda a mantener el equilibro en la rueda de la vida, mira siempre por esta ya que es el motor que recoge las almas tras la muerte, convive en armonía con las plantas y los animales, bendice el limbo con tu descendencia, y enseña a las generaciones venideras el amor por la vida y la muerte." },
                { n: "Irion", t: "Deidad intermedia", r: "Mientras los dos dioses establecidos se hacían presentes en el limbo, la masa de energía divina de Mitra, Crom y Ymir, se encontraba oscilando en el cosmos en una espiral en continuo movimiento, finalmente un enorme estallido de luz formo…",
                  d: "Mientras los dos dioses establecidos se hacían presentes en el limbo, la masa de energía divina de Mitra, Crom y Ymir, se encontraba oscilando en el cosmos en una espiral en continuo movimiento, finalmente un enorme estallido de luz formo a Irión, la luz mas pura y radiante, tras su nacimiento tomo total control de Limbo, arraigando así su influencia divina desde el desierto, los túmulos y todo cuanto rodea las tierras nevadas, impidiendo así que la influencia de Chassaria se expanda, Irion envió sus guardianes para guiar a los sacerdotes y gentes de Limbo, ayudándolas a combatir las hordas infectas de Chassaria.",
                  a: "Legal Bueno", dom: "Luz, Purificación, Guerra, Orden", p: "Las dunas eternas", dg: "Lucha por los tuyos y por quien no sean los tuyos, ofrece tu bondad a aquellos que la necesitan, pero mas aun aquellos que no la conocen, combate el mal pues este debe ser purificado, no permitas las injusticias se el primero en tender la mano a quien lo necesite, la luz es la guía, ilumina incluso en la mas pura oscuridad, bendice con tus mejores deseos aquellos ajenos, no diferencies entre seres distintos, todos hayamos luz en nuestro interior, combate en las guerras con honor, respeta a tus enemigos y no los subestimes, condena la corrupción y recházala purificándola con tu espada." },
                { n: "Lothshi", t: "Deidad mayor", r: "El dios de las sombras fue concebido cuando Shinistra la hija de Loth absorbió el poder de su madre, actualmente es un dios con mucha influencia en el limbo, el dios Lothshi apareció durante el transcurso de las batallas acontecidas por…",
                  d: "El dios de las sombras fue concebido cuando Shinistra la hija de Loth absorbió el poder de su madre, actualmente es un dios con mucha influencia en el limbo, el dios Lothshi apareció durante el transcurso de las batallas acontecidas por los fieles de los nuevos dioses, tras las la caída de los últimos altares de Chassaria en la tierras verdes y los túmulos, la entidad se manifestó, actualmente domina y controla de las tierras verdes y los túmulos, dominios antes pertenecientes a Iasis principalmente, el cual no a mostrado interés en volver a tomar su antigua influencia en la zona, Lothshi es un acérrimo aliado de Iasis, es la única alianza formal entre dioses en el Limbo, conocido como el dios de las arañas, las sombras y el subterfugio, a veces puede llegar a ser sádico y cruel.",
                  a: "Caótico Neutral", dom: "Asesinato, Urdimbre, Arañas, Sombras, Subterfugio", p: "Ruinas del tercer imperio", dg: "Ocúltate en las sombras, ellas son tus mas fieles compañeras, asesina a quien ofenda a tu dios pues el que primero golpea es el que mas fuerte golpea, adora la urdimbre como la pura esencia de Lothshi, en su telaraña tejen con hilos de urdimbre los conocimientos del mundo mismo, las arañas son sagradas, aprende a respetarlas y a cuidar de sus huevos para que logren eclosionar sanas, el sigilo y la sutileza son tu mayor fuerza, se totalmente libre, oculta los secretos de esta existencia y guárdalos solo para tu señor, entrega tus actos hacia este, correspóndelo con lo que merece y el gesto volverá a ti directamente de el" },
                { n: "Baraka", t: "Deidad menor", r: "Tras las creación de los nuevos dioses quedaron vestigios de corrupción que se acumularon en el abismo, poco a poco esa corrupción se concentró, de aquellas partes que los dioses habían desechado de sí mismos, se formó una entidad nacida…",
                  d: "Tras las creación de los nuevos dioses quedaron vestigios de corrupción que se acumularon en el abismo, poco a poco esa corrupción se concentró, de aquellas partes que los dioses habían desechado de sí mismos, se formó una entidad nacida de todo lo negativo que los nuevos dioses no deseaban tener en sus seres, el dolor, al caos, destrucción y nigromancia, Baraka es una deidad intermedia nacida de los desechos de la nueva creación, Tras formarse en el abismo otras entidades junto a ella nacieron dando a pie a otras formas de vida caóticas que buscaban robar su poder, en un intento de controlarlas baraka las encerró en un plano ajeno encadenando a esas criaturas, tras la segunda colisión, esas cadenas fueron rotas y el caos fue desatado en el nuevo Limbo.",
                  a: "Caótico Maligno", dom: "Caos, destruccion, sufrimiento", p: "El abismo", dg: "El caos que llevas dentro debe ser compartido con el mundo, destruye y haz arder este mundo, pues la vida está condenada a ser destruida, haz sufrir a todos aquellos que te rodean, todo deseo está justificado no importa cuán descabellado y mórbido sea, trae el caos a este mundo, destruye todo cuanto puedas pues las llamas nos liberaran de las cadenas, la vida es una condena, abraza la vida eterna." },
                { n: "Mushalee", t: "Deidad intermedia", r: "Gran pulpo de los mares, el kraken así es como le llaman los piratas, Mushalee a velado por las criaturas de los mares o los navegantes desde eones, aunque pocos conocen de su existencia, los piratas suelen lanzar parte de sus tesoros al…",
                  d: "Gran pulpo de los mares, el kraken así es como le llaman los piratas, Mushalee a velado por las criaturas de los mares o los navegantes desde eones, aunque pocos conocen de su existencia, los piratas suelen lanzar parte de sus tesoros al mar para calmar al dios de los mares y ganarse su beneplácito, Todos temen la fuerza del mar, la tormentas y los huracanes, algunos dicen que son obra de Mushalee la entidad que reclama las aguas como su dominio.",
                  a: "Caotico Neutral", dom: "Agua, Tormenta, Caos, Aire", p: "El mar perdido", dg: "Las aguas son salvajes y libres, concede parte de tu recompensa al dios de los mares para calmar su ira, Las tormentas causan movimiento el aire y el agua son símbolos de la libertad, reza a Mushalee cuando te embarques en los mares, pues nadie conoce las aguas más que el, allí donde todos los seres de agua anidan encontrarás al dios del mar." },
                { n: "Serathovah", t: "Deidad menor", r: "El gran ciervo blanco, la representación de la sinceridad y la aceptación, Serathovah es una diosa benévola compasiva y arropadora, siente un gran amor por los seres vivos, es la más pura representación del arte, Serathovah apareció tras…",
                  d: "El gran ciervo blanco, la representación de la sinceridad y la aceptación, Serathovah es una diosa benévola compasiva y arropadora, siente un gran amor por los seres vivos, es la más pura representación del arte, Serathovah apareció tras la segunda colisión, manifestándose ante los que sufrían para darles esperanza, Serathovah es la diosa del amor, del arte y de la aceptación, ve a todos los mortales por igual sin excepción alguna, pues en todo lugar hay espacio para el arte, el amor y la empatía.",
                  a: "Neutral bueno", dom: "Amor, Arte, Viaje, Protección", p: "La casa de todos", dg: "El amor es una de las fuerzas más subestimadas de la existencia, ama sin miedo a los demás, acepta su exterior para conocer su escondido interior, haz sonar las notas en tus viajes, canta a los vientos para que tu voz viaje por la existencia de otras criaturas, la canción dará jolgorio aquellos que la escuchan, deja que el gran ciervo blanco te guie y te proteja en tus viajes, el te guiara y tu suerte cambiará." },
                { n: "Zark", t: "Deidad intermedia", r: "Conocido como el dominador, Zark es un dios meticuloso y calculador, el brazo de hierro, un dios tirano el cual disfruta enfrentándose a otros dioses, El conflicto le mueve, y no duda en mandar a sus fieles directos a la muerte con tal de…",
                  d: "Conocido como el dominador, Zark es un dios meticuloso y calculador, el brazo de hierro, un dios tirano el cual disfruta enfrentándose a otros dioses, El conflicto le mueve, y no duda en mandar a sus fieles directos a la muerte con tal de demostrar su influencia, Zark fue formado de los restos de las batallas entre los dioses, esos choques de energía divina residuales poco a poco se fueron acumulando en un plano alterno, Zark se manifestó por primera vez tras la segunda colisión, desde entonces sus fieles se aglomeran en el norte.",
                  a: "Neutral Maligno", dom: "Tiranía, Fuerza, Mal", p: "Plano de los vestigios", dg: "La fuerza es la mayor baza en un enfrentamiento, el brazo de hierro observa pendiente de tus actos, no lo decepciones y muere por el de ser necesario, pues le debemos nuestro sometimiento, domina a tus enemigos con tu fuerza y aplasta a estos  hasta que no quede nada de ellos, su tiranía llegará a cada rincón del Limbo, y el mundo se someterá ante su fuerza." },
                { n: "Luminae", t: "Deidad intermedia", r: "En el reino de la Noche eterna, el esplendor de las estrellas revela el vínculo entre el mundo de los sueños y la esencia espiritual.",
                  d: "En el reino de la Noche eterna, el esplendor de las estrellas revela el vínculo entre el mundo de los sueños y la esencia espiritual. La Noche es testigo silente del poder del espíritu humano, conectándose a través de los sueños con las profundidades del cosmos. En este reino oscuro y místico, el espíritu encuentra su morada temporal, explorando las dimensiones de los sueños donde las estrellas son faros que guían su camino en la penumbra del inconsciente. El espiritismo encuentra su lugar en este santuario de la noche, donde los espíritus danzan entre las constelaciones, buscando respuestas y conexión en la quietud de la oscuridad.",
                  a: "Neutral Autentica", dom: "Noche, Espiritismo, Estrellas, Sueños", p: "El sueño eterno", dg: "Déjate guiar por las estrellas, con ellas alcanzaras el cosmos, la noche es el remanso del descanso para aquellos que se adentran en el reino de los sueños, deja que tu espíritu se libere formando parte del remanso de los cuervos. Mantente fiel a la luz que las estrellas te brindan y no te dejes arrastrar por la corrupción engañosa que oscurece tu entendimiento." },
                { n: "Vilza", t: "Deidad intermedia", r: "Tras la creación de los abisales de los primeros destacaron dos de las creaciones de Yog, la primera fue Baraka, la abisal mas poderosa de todas, tras eones y cataclismos provocados por el caos, Vilza junto a otros abisales estuvieron…",
                  d: "Tras la creación de los abisales de los primeros destacaron dos de las creaciones de Yog, la primera fue Baraka, la abisal mas poderosa de todas, tras eones y cataclismos provocados por el caos, Vilza junto a otros abisales estuvieron recluidos y encadenados en el vórtice del caos del abismo, con la caída de Baraka el abismo dejo de girar, y Vilza abandono la cárcel a la cual se vio sometida durante eones, actualmente vaga por el Limbo, salvaguardando la vida y las criaturas del Limbo, tras caer el abismo, este fue alcanzado por la pureza de los pocos abisales que quedaron, tornando el plano en un lugar blanco lleno de flores blancas, desde entonces Vilza observa el mundo con pasion y pesar.",
                  a: "Neutral Buena", dom: "Bien, Saber, Equilibro", p: "Abismo puro", dg: "Por muy miserable o dolorosa que sea tu existencia mantente en pie y sonríe, Veras a muchos sufrir a tu alrededor y con ello sufrirás tu, pero no dejes que eso te hunda, combate el odio y el rencor con amabilidad, vela por aquellos que sufren, vela por aquellos que lo han perdido todo, vela por los apestados y los rechazados, alguien debe cambiar las cosas, mantente fuerte, lucha por la aceptación y no olvides jamas que hasta en el engendro mas horroroso puede haber un corazon que siente y padece." },
                { n: "Zenelithca", t: "Deidad intermedia", r: "Ante el encierro de Loth tras la primera noche de los cielos rotos, el sufrimiento de la deidad dejo su dolor concentrado en el subsuelo del volcán, ese dolor poco a poco fue tomando forma, naciendo así esta entidad, la cual se oculto en…",
                  d: "Ante el encierro de Loth tras la primera noche de los cielos rotos, el sufrimiento de la deidad dejo su dolor concentrado en el subsuelo del volcán, ese dolor poco a poco fue tomando forma, naciendo así esta entidad, la cual se oculto en un plano distante el Limbo, esta entidad se alimento durante años del sufrimiento y el terror de los mortales, creciendo poco a poco y tornando su esencia basada en la urdimbre residual de la diosa olvidada, una entidad atormentada, nacida de la tortura y del olvido busca tomar su lugar en el mundo, guiando a los mortales hacia la superación y la propagación del terror y el dolor.",
                  a: "Neutral Maligno", dom: "Dolor, Terror, Urdimbre sombría, tortura", p: "Plano opaco", dg: "El mundo te golpeara hasta la saciedad, no huyas de el, pues ese sufrimiento te hará crecer, propaga el terror y la tortura a quienes desees, cada gota de sangre derramada es una enseñanza mas para aquellos que temen la verdad, la urdimbre no tiene una sola forma busca cambiarla para encontrar la verdadera oscuridad, Ensarta aquellos cobardes que se niegan aceptar la verdadera existencia, la muerte no propaga el dolor, deja vivos aquellos que te han herido, para poder hacerlos sufrir hasta que deseen morir." }
            ];

            /* Casillas especiales (las que no son dioses). Se pulsan igual que un dios y, al llegar, hacen algo:
               fx = back (retrocede v[0]-v[1]) · fwd (avanza v[0]-v[1]) · bonus (tirada extra) · start (vuelve a la salida)
                    nextGod (salta al siguiente dios) · randGod (salta a un dios al azar) · tp (a cualquier casilla al azar)
                    opposite (al lado contrario del tablero) */
            const SPECIAL = [
                { n: 'Trampa',    fx: 'back',     v: [3, 3], d: 'Una trampa se activa bajo tus pies: retrocedes 3 casillas.' },
                { n: 'Tesoro',    fx: 'bonus',               d: 'Encuentras un cofre con una tirada extra: el dado vuelve a rodar y avanzas lo que salga.' },
                { n: 'Hoguera',   fx: 'start',               d: 'La hoguera del campamento te llama de vuelta: regresas a la salida.' },
                { n: 'Cripta',    fx: 'nextGod',             d: 'Las sombras de la cripta te empujan hasta el siguiente dios del camino.' },
                { n: 'Portal',    fx: 'tp',                  d: 'Un portal inestable se abre y te lanza a un lugar al azar del tablero.' },
                { n: 'Altar',     fx: 'randGod',             d: 'El altar elige por ti: apareces ante un dios cualquiera.' },
                { n: 'Emboscada', fx: 'back',     v: [1, 5], d: '¡Emboscada! Huyes y retrocedes entre 1 y 5 casillas.' },
                { n: 'Santuario', fx: 'fwd',      v: [5, 5], d: 'Un santuario te bendice con viento a favor: avanzas 5 casillas.' },
                { n: 'Niebla',    fx: 'fwd',      v: [1, 6], d: 'La niebla te desorienta y avanzas entre 1 y 6 casillas sin ver el camino.' },
                { n: 'Taberna',   fx: 'opposite',            d: 'Una ronda de más y despiertas en el lado contrario del mapa.' }
            ];

            const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
            const board = document.getElementById('dz-board');
            if (!board) return;
            const $ = id => document.getElementById(id);
            const token = $('dz-token'), say = $('dz-say'), d20 = $('dz-d20'), numEl = $('dz-num'), panel = $('dz-panel'), pad = $('dz-pad'), wrap = $('dz-wrap');
            const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
            const alive = () => !!document.getElementById('dz-board') && document.getElementById('dz-board') === board;
            const wait = ms => new Promise(r => setTimeout(r, ms));
            const rnd = (a, b) => a + ((Math.random() * (b - a + 1)) | 0);

            /* Recorrido: tablero de 7 x 6 con 22 casillas en el borde. La 0 es la salida (arriba a la izquierda, dentro del
               tablero) y las casillas 1 a 21 siguen el sentido del reloj. El d20 llega como mucho a la 20; si falta más,
               se tira una vez, se avanza y se vuelve a tirar solo lo que falte. */
            const cols = 7, rows = 6, L = 2 * (cols + rows) - 4, DMAX = 20;
            board.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
            board.style.gridTemplateRows = 'repeat(' + rows + ', 1fr)';
            board.style.setProperty('--cols', cols); board.style.setProperty('--rows', rows);
            $('dz-center').style.gridArea = '2 / 2 / ' + rows + ' / ' + cols;
            const cellAt = i => {                       // posición 0..L-1 -> [fila, columna]
                if (i < cols) return [1, 1 + i];
                if (i < cols + rows - 1) return [1 + (i - cols + 1), cols];
                if (i < 2 * cols + rows - 2) return [rows, cols - 1 - (i - (cols + rows - 1))];
                return [rows - 1 - (i - (2 * cols + rows - 2)), 1];
            };
            const place = (el, pos) => { const [r, c] = cellAt(pos); el.style.gridArea = r + ' / ' + c; };
            place(pad, 0);

            // Los dioses se reparten por igual por las casillas 1 a 20 (el último, Zenelithca, cae en la 20).
            const n = GODS.length;
            const godPos = GODS.map((g, k) => n > 1 ? Math.round(1 + k * (DMAX - 1) / (n - 1)) : 1);
            const godAt = {}, spAt = {}, tiles = [];
            let si = 0;
            for (let pos = 1; pos < L; pos++) {
                const k = godPos.indexOf(pos);
                const el = document.createElement('button'); el.type = 'button'; el.dataset.pos = pos;
                if (k >= 0) {
                    godAt[pos] = k + 1; el.className = 'dz-tile';
                    el.innerHTML = '<span class="n">' + pos + '</span>' + esc(GODS[k].n);
                    el.setAttribute('aria-label', 'Ir a ' + GODS[k].n + ' (casilla ' + pos + ')');
                } else {
                    const sp = SPECIAL[si++ % SPECIAL.length]; spAt[pos] = sp; el.className = 'dz-tile dz-fill';
                    el.innerHTML = '<span class="n">' + pos + '</span>' + esc(sp.n);
                    el.setAttribute('aria-label', 'Ir a ' + sp.n + ' (casilla ' + pos + ')');

                const sp = spAt[pos];
                say.innerHTML = 'Has caído en <b>' + esc(sp.n.toUpperCase()) + '</b>.';
                showSpecial(pos, withFx ? '' : 'Llegaste por un efecto, así que esta casilla no se activa.');
                if (withFx) {
                    await wait(reduce ? 0 : 1300); if (!alive()) return;
                    await applyFx(sp); if (!alive()) return;
                    await arrive(cur, false);
                }
            }

            async function goTo(target) {
                if (busy) return;
                setBusy(true); ac(); clearOn(); pad.classList.remove('on');
                if (await travel(target)) await arrive(target, true);
                if (alive()) setBusy(false);
            }

            board.addEventListener('click', e => { const t = e.target.closest('button.dz-tile'); if (t && t.dataset.pos) goTo(+t.dataset.pos); });
            panel.addEventListener('click', e => {
                const mo = e.target.closest('#dz-more');
                if (mo) { openDetail(+mo.dataset.k); return; }
                if (!e.target.closest('#dz-rand') || busy) return;
                let p; do { p = 1 + ((Math.random() * (L - 1)) | 0); } while (p === cur);
                goTo(p);
            });

            // Aparecer al bajar
            const els = document.querySelectorAll('.reveal');
            if ('IntersectionObserver' in window) {
                const io = new IntersectionObserver(en => en.forEach(x => x.target.classList.toggle('active', x.isIntersecting)), { rootMargin: '0px 0px -8% 0px', threshold: 0.05 });
                els.forEach(el => io.observe(el));
            } else els.forEach(el => el.classList.add('active'));
        })();
    </script>
</body>
</html>
